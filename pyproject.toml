[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdrive"
version = "0.8.4"
description = "A simple web-based document and file manager"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Huy Nguyen", email = "121183+huyng@users.noreply.github.com" },
]
keywords = [
    "file-manager",
    "file-browser",
    "flask",
    "vue",
    "web",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "Flask",
    "gunicorn",
]

[project.urls]
Homepage = "https://github.com/huyng/pdrive"
Repository = "https://github.com/huyng/pdrive"
Issues = "https://github.com/huyng/pdrive/issues"

[project.scripts]
pdrive = "pdrive.backend.web:main"

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------
# The Python sources live in the `pdrive` package, while the pre-built Vue
# frontend is shipped as package data under `pdrive/frontend/dist`.
[tool.hatch.build]
# The root .gitignore ignores `dist` (and thus the pre-built UI assets), so
# rely on the explicit include/exclude lists below instead of VCS patterns.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["pdrive"]
exclude = [
    "pdrive/frontend/node_modules",
    "pdrive/frontend/src",
    "pdrive/frontend/package.json",
    "pdrive/frontend/package-lock.json",
    "pdrive/frontend/README.md",
    "pdrive/frontend/babel.config.js",
    "pdrive/frontend/vite.config.js",
    "pdrive/frontend/.gitignore",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.DS_Store",
]

[tool.hatch.build.targets.sdist]
include = [
    "/pdrive",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "pdrive/frontend/node_modules",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.DS_Store",
]

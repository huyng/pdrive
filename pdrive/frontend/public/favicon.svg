<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="pDrive">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DB4FF"/>
      <stop offset="1" stop-color="#0E6FD4"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#B9D7F6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE3F9"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#FFFFFF" stroke-opacity=".28"/>

  <!-- the folder, stretched 12% about its own middle so it is not squat
       beside the word mark; the same drawing and the same stretch as the
       inline mark in src/components/BrandLogo.jsx -->
  <g transform="translate(0 32) scale(1 1.12) translate(0 -32)">
    <!-- folder tab and back panel -->
    <path fill="url(#back)" d="M11 18.5a4.5 4.5 0 0 1 4.5-4.5h9.2a4.5 4.5 0 0 1 3.5 1.7l2.6 2.8H48.5a4.5 4.5 0 0 1 4.5 4.5V27H11z"/>

    <!-- folder front panel -->
    <path fill="url(#front)" d="M11 25h42v20.5a4.5 4.5 0 0 1-4.5 4.5H15.5a4.5 4.5 0 0 1-4.5-4.5z"/>

    <!-- soft edge between the two panels -->
    <path d="M11 25h42" stroke="#0E6FD4" stroke-opacity=".28" stroke-width="1.5"/>
  </g>
</svg>
